<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudNotes — Modern Cloud-Native Note Management</title>
    <meta name="description" content="A lightweight, cloud-native notes application built with Spring Boot, PostgreSQL, and AWS.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>CloudNotes</h1>
                    <span class="badge badge-subtle">AWS Ready</span>
                </div>
            </div>

            <div class="header-actions">
                <div id="healthBadge" class="health-badge" title="Actuator Health Status">
                    <span class="health-dot"></span>
                    <span id="healthText" class="health-text">Checking health...</span>
                </div>
                <button id="btnNewNote" class="btn btn-primary" aria-label="Create new note">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>New Note</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        <section class="controls-section">
            <div class="search-box">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Search notes by title or content..." autocomplete="off">
                <button id="btnClearSearch" class="btn-clear hidden" aria-label="Clear search">&times;</button>
            </div>
            <div class="stats-counter">
                <span id="notesCount" class="count-pill">0 notes</span>
            </div>
        </section>

        <!-- Notes Grid -->
        <section class="notes-section">
            <div id="notesGrid" class="notes-grid">
                <!-- Cards injected dynamically via JS -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state hidden">
                <div class="empty-illustration">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="12" y1="18" x2="12" y2="12"></line>
                        <line x1="9" y1="15" x2="15" y2="15"></line>
                    </svg>
                </div>
                <h3>No notes found</h3>
                <p id="emptyStateSubtitle">Capture your thoughts, architecture notes, and deployment ideas.</p>
                <button id="btnEmptyCreate" class="btn btn-secondary">Create your first note</button>
            </div>

            <!-- Loading Spinner -->
            <div id="loadingIndicator" class="loading-state">
                <div class="spinner"></div>
                <span>Loading notes from cloud database...</span>
            </div>
        </section>
    </main>

    <!-- Note Modal (Create / Edit) -->
    <div id="noteModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modalTitle">Create New Note</h2>
                <button id="btnModalClose" class="btn-icon" aria-label="Close modal">&times;</button>
            </div>
            <form id="noteForm" class="modal-form">
                <input type="hidden" id="noteId">
                <div class="form-group">
                    <label for="noteTitle">Title</label>
                    <input type="text" id="noteTitle" required maxlength="200" placeholder="e.g., AWS VPC Subnet Planning" autocomplete="off">
                    <span id="titleError" class="field-error"></span>
                </div>
                <div class="form-group">
                    <label for="noteContent">Content</label>
                    <textarea id="noteContent" rows="7" required placeholder="Write your note markdown or text here..."></textarea>
                    <span id="contentError" class="field-error"></span>
                </div>
                <div class="modal-footer">
                    <button type="button" id="btnModalCancel" class="btn btn-ghost">Cancel</button>
                    <button type="submit" id="btnModalSave" class="btn btn-primary">
                        <span>Save Note</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="deleteModal" class="modal-overlay hidden" role="dialog" aria-modal="true">
        <div class="modal-card modal-confirm">
            <div class="modal-header">
                <h2>Delete Note?</h2>
                <button id="btnDeleteClose" class="btn-icon">&times;</button>
            </div>
            <p class="confirm-message">Are you sure you want to delete this note? This action permanently removes it from the database.</p>
            <div class="modal-footer">
                <button type="button" id="btnDeleteCancel" class="btn btn-ghost">Keep Note</button>
                <button type="button" id="btnDeleteConfirm" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="/js/app.js"></script>
</body>
</html>
